      #   Links to DragonflyDB instances
      #

      - ${DRAGONFLYDB_MASTER1_HOSTNAME:-dragonfly_master1}
      - ${DRAGONFLYDB_MASTER2_HOSTNAME:-dragonfly_master2}
      - ${DRAGONFLYDB_MASTER3_HOSTNAME:-dragonfly_master3}
      - ${DRAGONFLYDB_SLAVE1_HOSTNAME:-dragonfly_slave1}
      - ${DRAGONFLYDB_SLAVE2_HOSTNAME:-dragonfly_slave2}
      - ${DRAGONFLYDB_SLAVE3_HOSTNAME:-dragonfly_slave3}

    volumes:

      #
      #   Bind Pools: Edit .env file to change the pool variant or use the default 3pool
      #

      - ../config/mcrouter_${MCROUTER_POOL_VARIANT:-2LoadBalancerPooll+1FailoverPool}_3master_3slave.json:/etc/mcrouter/mcrouter_config.json

    command: mcrouter --config-file=/etc/mcrouter/mcrouter_config.json -p 11211
