# ----------------------------------------------------------------------------------#

#   STACK NETWORK    ---------------------------------------------------------------#

networks:                                                                           #

  #   Private network for application services    ----------------------------------#

  kabballa_private_network:
    #
    #   SSH command to create the Docker network: 
    #   docker network create --driver bridge kabballa_private_network --subnet=172.16.0.0/16
    #

    external: true

  #   Private network for mcrouter services    ------------------------------------#

  mcrouter_private_network:
    #
    #   Setup Network Driver in .env or use default bridge
    #

    driver: bridge
    external: false

  #   Private network for dragonfly services    ------------------------------------#

  dragonfly_private_network:
    #
    #   Setup Network Driver in .env or use default bridge
    #

    driver: bridge
    external: false

# ----------------------------------------------------------------------------------#

#   STACK SERVICES    --------------------------------------------------------------#

services:

  # --------------------------------------------------------------------------------#

  #   MASTER NODE 1   --------------------------------------------------------------#

  dragonfly_master1:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: dragonflydb-cluster.${DRAGONFLYDB_MASTER1_HOSTNAME:-dragonfly_master1}
    hostname: ${DRAGONFLYDB_HOSTNAME:-localhost}
    restart: always
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "11211"]
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits:
      #
      #   Set memory lock limits on .env or use value for memlock is set to -1 for auto-adjustment
      #

      memlock: ${DRAGONFLYDB_MEMLOCK:-4294967296}

    ports:
      #
      #   Expose the master node port
      #

      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:11214:11211"

    volumes:
      #
      #   Config for master
      #

      - ../config/dragonfly_master1_config.json:/etc/dragonfly/dragonfly_config.json

      #
      #   Volume for master data
      #

      - dragonfly_master1_data:/data

    command:
      #
      #   Command to startr= dragonfly and set the Memcache port
      #

      - "dragonfly"
      - "--memcached_port"
      - "11211"

      #
      #   Command to setup cluster mode
      #

      - "--cluster_mode"
      - "yes"

      #
      #   Use the environment variable for setup cron
      #

      - "--snapshot_cron=${SNAPSHOT_CRON:-*/5 * * * *}"

    networks:
      #
      #   Connect to the private networks
      #

      - dragonfly_private_network

    extra_hosts:
      #
      #   Add extra host entries for internal resolution
      #

      - "host.docker.internal:host-gateway"
      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:host-gateway"

      #
      #   Add extra service entries for internal resolution
      #

      - "${DRAGONFLYDB_MASTER1_HOSTNAME:-dragonfly_master1}:${LOCAL_LISTEN_ADDR:-127.0.0.1}"


