#   STACK NETWORK    ---------------------------------------------------------------#

networks:                                                                           #

  # --------------------------------------------------------------------------------#

  #   Private network for application services    ----------------------------------#

  kabballa_private_network:
    #
    #   SSH command to create the Docker network: docker network create --driver bridge kabballa_private_network --subnet=172.16.0.0/16
    #

    external: true

  # --------------------------------------------------------------------------------#

  #   Private network for mcrouter services    -------------------------------------#

  mcrouter_private_network:
    #
    #   Setup Network Driver in .env or use default bridge
    #

    driver: bridge
    external: false

  # --------------------------------------------------------------------------------#

  #   Private network for memcached services    ------------------------------------#

  memcached_private_network:
    #
    #   Setup Network Driver in .env or use default bridge
    #

    driver: bridge
    external: false


# ----------------------------------------------------------------------------------#

#   STACK SERVICES    --------------------------------------------------------------#

services:                                                                           #

  # --------------------------------------------------------------------------------#

  #   DRAGONFLY SERVER 1    --------------------------------------------------------#

  dragonfly1:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: dragonfly1
    hostname: ${DRAGONFLYDB_HOSTNAME:-localhost}
    ulimits:
      #
      #   Default value for memlock is set to -1 for auto-adjustment
      #

      memlock: ${DRAGONFLYDB_MEMLOCK:-4194304}

    command:
      #
      #   Command to set the Memcache port
      #

      - "--memcached_port"
      - "11211"

    ports:
      #
      #   Port mapping for DragonflyDB
      #

      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:11212:11211"

    volumes:
      #
      #   Volume to store DragonflyDB data
      #

      - dragonflydata1:/data

      #
      #   Local time
      #

      - /etc/localtime:/etc/localtime:ro

    networks:
      #
      #   Connect to the private network
      #

      - memcached_private_network

    extra_hosts:
      #
      #   Add extra host entries for internal resolution
      #

      - "host.docker.internal:host-gateway"
      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:host-gateway"

      #
      #   Setup DRAGONFLYDB1_HOSTNAME variable in .env file
      #

      - "${DRAGONFLYDB1_HOSTNAME:-dragonfly1}:${LOCAL_LISTEN_ADDR:-127.0.0.1}"


  # --------------------------------------------------------------------------------#

  #   DRAGONFLY SERVER 2    --------------------------------------------------------#

  dragonfly2:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: dragonfly2
    hostname: ${DRAGONFLYDB_HOSTNAME:-localhost}
    ulimits:
      #
      #   Default value for memlock is set to -1 for auto-adjustment
      #

      memlock: ${DRAGONFLYDB_MEMLOCK:-4194304}

    command:
      #
      #   Command to set the Memcache port
      #

      - "--memcached_port"
      - "11211"

    ports:
      #
      #   Port mapping for DragonflyDB
      #

      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:11213:11211"

    volumes:
      #
      #   Volume to store DragonflyDB data
      #

      - dragonflydata2:/data

    networks:
      #
      #   Connect to the private network
      #

      - memcached_private_network

    extra_hosts:
      #
      #   Add extra host entries for internal resolution
      #

      - "host.docker.internal:host-gateway"
      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:host-gateway"

      #
      #   Setup DRAGONFLYDB2_HOSTNAME variable in .env file
      #

      - "${DRAGONFLYDB2_HOSTNAME:-dragonfly2}:${LOCAL_LISTEN_ADDR:-127.0.0.1}"


  # --------------------------------------------------------------------------------#

  #   DRAGONFLY SERVER 3    --------------------------------------------------------#

  dragonfly3:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: dragonfly3
    hostname: ${DRAGONFLYDB_HOSTNAME:-localhost}
    ulimits:
      #
      #   Default value for memlock is set to -1 for auto-adjustment
      #

      memlock: ${DRAGONFLYDB_MEMLOCK:-4194304}

    command:
      #
      #   Command to set the Memcache port
      #

      - "--memcached_port"
      - "11211"

    ports:
      #
      #   Port mapping for DragonflyDB
      #

      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:11214:11211"

    volumes:
      #
      #   Volume to store DragonflyDB data
      #

      - dragonflydata3:/data

    networks:
      #
      #   Connect to the private network
      #

      - memcached_private_network

    extra_hosts:
      #
      #   Add extra host entries for internal resolution
      #

      - "host.docker.internal:host-gateway"
      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:host-gateway"

      #
      #   Setup DRAGONFLYDB3_HOSTNAME variable in .env file
      #

      - "${DRAGONFLYDB3_HOSTNAME:-dragonfly3}:${LOCAL_LISTEN_ADDR:-127.0.0.1}"


  # --------------------------------------------------------------------------------#

  #   MCROUTER 1    ----------------------------------------------------------------#

  mcrouter1:
    image: coozila/mcrouter:${MCROUTER_VERSION:-40.0.0}
    container_name: mcrouter1-${MCROUTER_VERSION:-40.0.0}.${MCROUTER1_HOSTNAME:-mcrouter1}
    hostname: ${MCROUTER_HOSTNAME:-localhost}
    platform: linux/amd64
    links:
      #
      #   Links to DragonflyDB instances
      #

      - dragonfly1:dragonfly1
      - dragonfly2:dragonfly2
      - dragonfly3:dragonfly3

    volumes:
      #
      #   Map config file
      #

      - ./config/mcrouter_config.json:/etc/mcrouter/mcrouter_config.json

    command: mcrouter --config-file=/etc/mcrouter/mcrouter_config.json -p 11211
    ports:
      #
      #   Port mapping for Mcrouter
      #

      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:11211:11211"

    networks:
      #
      #   Connect to the private network
      #

      - kabballa_private_network
      - mcrouter_private_network

    extra_hosts:
      #
      #   Add extra host entries for internal resolution
      #

      - "host.docker.internal:host-gateway"
      - "${LOCAL_LISTEN_ADDR:-127.0.0.1}:host-gateway"

      #
      #   Setup MCROUTER1_HOSTNAME variable in .env file
      #

      - "${MCROUTER1_HOSTNAME:-mcrouter1}:${LOCAL_LISTEN_ADDR:-127.0.0.1}"


# ----------------------------------------------------------------------------------#

#   STACK VOLUMES  -----------------------------------------------------------------#

volumes:

  #
  #   STACK DRAGONFLY DATA 1 STORAGE
  #

  dragonflydata1:
    driver: local

  #
  #   STACK DRAGONFLY DATA 2 STORAGE
  #

  dragonflydata2:
    driver: local

  #
  #   STACK DRAGONFLY DATA 3 STORAGE
  #

  dragonflydata3:
    driver: local


# ----------------------------------------------------------------------------------#
